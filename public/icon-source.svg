<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1530"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0061ff"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Accent corner glow -->
  <circle cx="420" cy="92" r="120" fill="url(#accent)" opacity="0.15" filter="url(#glow)"/>
  <!-- Brand text -->
  <text x="50%" y="44%" text-anchor="middle"
        font-family="Impact, 'Barlow Condensed', sans-serif"
        font-weight="900" font-size="160" fill="#ffffff"
        letter-spacing="2">B3</text>
  <text x="50%" y="62%" text-anchor="middle"
        font-family="Impact, 'Barlow Condensed', sans-serif"
        font-weight="900" font-size="68" fill="url(#accent)"
        letter-spacing="6">BETZ</text>
  <text x="50%" y="76%" text-anchor="middle"
        font-family="Impact, 'Barlow Condensed', sans-serif"
        font-weight="900" font-size="68" fill="#ffffff"
        letter-spacing="6">360</text>
  <!-- Bottom accent line -->
  <rect x="120" y="430" width="272" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
