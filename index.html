<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <!-- Branding -->
    <title>BETZ360 — Prop Intelligence</title>
    <meta name="description" content="AI-powered sports betting intelligence. Sharp-line overlay from Polymarket, CLV tracking, parlay analysis." />
    <meta name="theme-color" content="#05080f" />
    <meta name="color-scheme" content="dark" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Betz360" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph for social sharing.
         CRITICAL: og:image must be an absolute URL (https://) — relative paths
         like /betz360-og.jpg do NOT work on Twitter/X, Facebook, LinkedIn,
         iMessage, or any other platform that scrapes OG tags. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://betz360.com" />
    <meta property="og:site_name" content="Betz360" />
    <meta property="og:title" content="Betz360 — Sports Betting Intelligence" />
    <meta property="og:description" content="Sharp-line overlay, CLV tracking, AI projections. The edge tools sportsbooks don't want you to have." />
    <meta property="og:image" content="https://betz360.com/betz360-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Betz360 — Sports Betting Intelligence" />

    <!-- Twitter / X uses its own card variant. summary_large_image renders
         the full hero image instead of a thumbnail. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Betz360 — Sports Betting Intelligence" />
    <meta name="twitter:description" content="Sharp-line overlay, CLV tracking, AI projections. The edge tools sportsbooks don't want you to have." />
    <meta name="twitter:image" content="https://betz360.com/betz360-og.jpg" />
    <meta name="twitter:image:alt" content="Betz360 — Sports Betting Intelligence" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for offline support + faster repeat loads
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
