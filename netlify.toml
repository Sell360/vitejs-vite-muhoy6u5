[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Security headers applied to all responses.
# - X-Frame-Options DENY: blocks clickjacking (no embedding in iframes)
# - X-Content-Type-Options nosniff: blocks MIME-type confusion attacks
# - Referrer-Policy: strips referrer when leaving site (privacy)
# - Permissions-Policy: blocks unused browser APIs (camera, mic, geolocation)
# - Strict-Transport-Security: forces HTTPS for 2 years incl. subdomains
# - Content-Security-Policy: whitelists which origins can load resources;
#   if an attacker injects <script src=evil.com>, browser refuses to run it.
#   'unsafe-inline' for styles is needed because we use inline style attrs;
#   we deliberately avoid 'unsafe-inline' for scripts (Vite bundles all JS).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://js.stripe.com https://r.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://api.openweathermap.org https://gamma-api.polymarket.com https://*.netlify.app; frame-src https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'none'; upgrade-insecure-requests"

[functions."snapshot-lines"]
  schedule = "0 */2 * * *"

[functions."lock-house-picks"]
  schedule = "0 13 * * *"

[functions."auto-settle-picks"]
  schedule = "30 */2 * * *"

[functions."auto-settle-mock-bets"]
  schedule = "45 */2 * * *"

[dev]
  command = "npm run dev"
  port = 5173
