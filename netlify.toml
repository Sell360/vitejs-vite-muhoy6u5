[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions."snapshot-lines"]
  schedule = "0 */2 * * *"

[functions."lock-house-picks"]
  schedule = "0 13 * * *"

[functions."auto-settle-picks"]
  schedule = "30 */2 * * *"

[functions."auto-settle-mock-bets"]
  schedule = "45 */2 * * *"

[dev]
  command = "npm run dev"
  port = 5173
